[project]
name = "hirebot"
version = "0.1.0"
description = "AI-рекрутер: сбор откликов (HH.ru, Avito) -> анализ резюме -> диалог -> запись на собеседование в календаре Talantix"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    "cryptography>=44.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "faker>=33.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
hirebot = "hirebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirebot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Явно фиксируем область цикла событий для асинхронных фикстур:
# без этого pytest-asyncio 1.x выдаёт предупреждение и меняет поведение в будущих версиях.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a database (docker compose up -d postgres)",
    "network: performs real network calls; excluded by default",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "EM", "ISC",
    "ICN", "LOG", "G", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH", "RUF",
]
ignore = [
    "EM101", "EM102",   # message literals in exceptions: too noisy for domain errors
    "TRY003",
    # Докстринги и комментарии на русском: кириллические «с», «о», «г», «р», «х»
    # ложно опознаются как похожие латинские буквы.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S101"]
"src/hirebot/cli.py" = ["T201"]   # CLI prints to stdout on purpose
"scripts/*.py" = ["T201"]      # утилиты командной строки: print — вывод
# Имена доменных ошибок намеренно без суффикса Error: они читаются как часть
# предметного языка (SlotConflict, PolicyViolation), а не как технические исключения.
"src/hirebot/domain/errors.py" = ["N818"]
# Null-object реализации обязаны повторять сигнатуры протоколов,
# поэтому «неиспользуемые» аргументы здесь ожидаемы.
"src/hirebot/ports/infra.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true
