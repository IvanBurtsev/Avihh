# Reverse-proxy для hirebot: TLS, security-заголовки, метрики закрыты от внешнего мира.
#
# Два способа применения:
#   1) nginx на хосте (рекомендуется): скопируйте server-блоки в
#      /etc/nginx/conf.d/hirebot.conf, certbot положит сертификаты в
#      /etc/letsencrypt/live/<домен>/. Строки events/http из этого файла на хосте
#      уже есть в основном nginx.conf — не дублируйте их.
#   2) nginx в Docker (профиль `proxy` в deploy/docker-compose.prod.yml):
#      файл монтируется целиком как /etc/nginx/nginx.conf, поэтому здесь он
#      полный. Тогда сертификаты кладутся в deploy/tls/ (см. volume в compose).
#
# Обязательно замените hirebot.example.com на свой домен и проверьте пути к
# сертификатам. Перед перезагрузкой: nginx -t.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Не раскрываем версию nginx в ответах и ошибках.
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;      # совпадает с MAX_REQUEST_BODY_BYTES в API (1 МиБ)
    client_body_timeout 15s;
    client_header_timeout 10s;

    log_format hirebot '$remote_addr - $request_id [$time_local] "$request" $status '
                       '$body_bytes_sent "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log hirebot;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 512;

    # Адрес API. loopback — потому что API опубликован только на 127.0.0.1
    # (см. ports в docker-compose.prod.yml).
    upstream hirebot_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Ограничение частоты. Два ведра: обычный трафик и вебхуки площадок
    # (площадки ретраят, поэтому лимит мягче, чем кажется).
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_webhooks:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    # HTTP: только ACME-челлендж и редирект на HTTPS.
    server {
        listen 80;
        listen [::]:80;
        server_name hirebot.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name hirebot.example.com;

        # --- TLS ---------------------------------------------------------- #
        ssl_certificate     /etc/letsencrypt/live/hirebot.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hirebot.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling off;          # включать только с настроенным resolver

        # --- Security-заголовки ------------------------------------------- #
        # HSTS включайте, когда убедились, что весь трафик идёт по HTTPS:
        # браузер запомнит это на год.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # UI hirebot — своя статика из /ui/static; внешних скриптов нет.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Внимание: `add_header` внутри location отменяет наследование всех
        # заголовков из server — в локациях ниже они продублированы осознанно.
        # В nginx >= 1.25.1 HTTP/2 включается директивой `http2 on` выше;
        # в более старых (Debian/Ubuntu LTS) пишите `listen 443 ssl http2;`.

        limit_conn api_conn 32;

        # --- Метрики: только из внутренней сети --------------------------- #
        # Публично метрики не отдаются никогда: они раскрывают структуру
        # маршрутов и нагрузку. Дополнительно сам эндпоинт требует X-API-Key.
        # Prometheus обычно живёт в той же сети — впишите его адрес.
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            limit_req zone=api_general burst=10 nodelay;

            proxy_pass http://hirebot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Correlation-ID $request_id;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            access_log /var/log/nginx/metrics.log hirebot;
        }

        # --- Проверки живости --------------------------------------------- #
        # Доступны только с внутренних адресов (балансировщик, Kubernetes-пробы).
        location ~ ^/(health|health/ready|version)$ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://hirebot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            add_header Cache-Control "no-store" always;
        }

        # --- Вебхуки площадок --------------------------------------------- #
        # Подпись проверяется приложением (HIREBOT_SECURITY__WEBHOOK_SECRET);
        # прокси лишь ограничивает частоту и размер тела.
        location /webhooks/ {
            limit_req zone=api_webhooks burst=20 nodelay;

            proxy_pass http://hirebot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # --- Статика UI ---------------------------------------------------- #
        location /ui/static/ {
            proxy_pass http://hirebot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # --- Всё остальное ------------------------------------------------- #
        location / {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass http://hirebot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Один correlation id на весь путь запроса: по нему ищутся логи
            # и в API, и в задачах воркера, которые запрос породил.
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            # Дольше — уже ошибка: ручные действия рекрутера не должны висеть.
            proxy_read_timeout 60s;
            proxy_buffering on;
        }
    }
}
