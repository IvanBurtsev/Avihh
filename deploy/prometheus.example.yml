# Пример конфигурации Prometheus для hirebot (скрейп + алерты).
#
# Метрики закрыты: /metrics требует заголовок X-API-Key и, как правило, доступен
# только из внутренней сети (см. deploy/nginx.conf). Ключ попадает в этот файл,
# поэтому сам файл должен быть доступен только пользователю prometheus:
#
#   sudo chown prometheus:prometheus /etc/prometheus/prometheus.yml
#   sudo chmod 600 /etc/prometheus/prometheus.yml
#
# Prometheus не поддерживает чтение произвольного заголовка из файла (только
# Authorization через credentials_file), поэтому X-API-Key передаётся значением.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: hirebot

scrape_configs:
  - job_name: hirebot-api
    metrics_path: /metrics
    scheme: https
    # Если Prometheus ходит напрямую к API на loopback — http и target
    # 127.0.0.1:8000 (порт API опубликован только на localhost).
    static_configs:
      - targets: ["hirebot.example.com"]
    http_headers:
      X-API-Key:
        # Значение = HIREBOT_SECURITY__WEBHOOK_SECRET. Файл — только для
        # пользователя prometheus, в git его не коммитить.
        values: ["<вставьте HIREBOT_SECURITY__WEBHOOK_SECRET>"]

# Правила алертов: положите их в /etc/prometheus/hirebot-alerts.yml и
# раскомментируйте блок rule_files (иначе Prometheus не стартует из-за
# отсутствующего файла).
# rule_files:
#   - /etc/prometheus/hirebot-alerts.yml

